function simQ(x,y,vx,vy){for(let i=0;i<420;i++){const dt=1/60;x+=vx*dt;y+=vy*dt;const f=Math.exp(-DECAY*dt);vx*=f;vy*=f;
if(x<R){x=R;vx=Math.abs(vx)*.8}if(x>1-R){x=1-R;vx=-Math.abs(vx)*.8}if(y<R){y=R;vy=Math.abs(vy)*.8}if(y>1-R){y=1-R;vy=-Math.abs(vy)*.8}
for(const[a,b,c,d]of BASE){const ex=c-a,ey=d-b;let u=((x-a)*ex+(y-b)*ey)/(ex*ex+ey*ey);u=Math.max(0,Math.min(1,u));let dx=x-(a+ex*u),dy=y-(b+ey*u);const l=Math.hypot(dx,dy)||1e-6,m=R+T;if(l<m){dx/=l;dy/=l;x=a+ex*u+dx*m;y=b+ey*u+dy*m;const vn=vx*dx+vy*dy;if(vn<0){vx-=1.8*vn*dx;vy-=1.8*vn*dy}}}
if(Math.hypot(vx,vy)<.08)break}return quad(x,y)}
const CAND={};function botAim(q,P){const[cx,cy]=CORN[q],M=mid(q),ux=cx-M[0],uy=cy-M[1],ul=Math.hypot(ux,uy),k=K0*power/100,th0=Math.atan2(.5-M[1],.5-M[0]),cand=CAND[q]||(CAND[q]=[]);
if(!cand.length)for(let pf=.3;pf<=1.001;pf+=.05){const L=PULL*pf;for(let i=-16;i<=16;i++){const th=th0+i*Math.PI/45,dx=Math.cos(th),dy=Math.sin(th);if(-(dx*ux+dy*uy)/ul<.35)continue;cand.push({th,L,q2:simQ(M[0]-dx*L,M[1]-dy*L,dx*L*k,dy*L*k)})}}
const n=counts(),opp=[0,1,2,3].filter(i=>i!==q);let pool=cand;
if(diff==='hard'){const tgt=opp.reduce((a,b)=>n[b]<n[a]?b:a),t=cand.filter(c=>c.q2===tgt);pool=t.length?t:cand.filter(c=>c.q2!==q)}
else if(diff==='normal'||Math.random()<.5)pool=cand.filter(c=>c.q2!==q);
if(!pool.length)pool=cand;
const pk=pool[Math.floor(Math.random()*pool.length)],L=pk.L,th=pk.th+(Math.random()-.5)*2*P.noise,dx=Math.cos(th),dy=Math.sin(th);
return{sx:M[0]-dx*L,sy:M[1]-dy*L,vx:dx*L*k,vy:dy*L*k}}

if(u>=1){const c=b.c;c.held=false;c.vx=b.vx;c.vy=b.vy;c.by=q;c.vis=false;delete drags['b'+q];snaps[q]={x:c.x,y:c.y,t:now};beep(300+Math.hypot(b.vx,b.vy)*80);b.ph=0;b.t=now+rnd(P.gap[0],P.gap[1])}continue}
